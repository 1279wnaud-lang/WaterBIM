<section class="tab-panel" data-tab="standards-search" style="display:none">
      <header>
        <div class="header-top">
          <button class="sidebar-toggle" type="button" aria-label="사이드바 토글"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg></button>
          <div class="header-main">
            <p class="eyebrow">BIM Design Standards Search</p>
            <h1>설계기준 검색</h1>
            <div class="search-row">
              {{SEARCH_ICON}}
              <input id="stdSearchQ" type="text" placeholder="키워드 검색... (예: 맨홀 간격, 최소 유속, 토피)" autofocus autocomplete="off">
            </div>
            <div class="filters" id="stdFilters">
                <button class="chip active" data-filter="all"><span class="dot"></span>전체보기</button>
                <button class="chip" data-filter="supply"><span class="dot"></span>상수도</button>
                <button class="chip" data-filter="sewer"><span class="dot"></span>하수도</button>
                <button class="chip" data-filter="kwcs"><span class="dot"></span>전문시방서</button>
                <button class="chip" data-filter="guide"><span class="dot"></span>실무지침</button>
            </div>
            <div id="stdMeta"></div>
          </div>
        </div>
      </header>
      <div class="layout" id="stdLayout">
        <main id="stdResults" class="std-results"></main>
      </div>
    </section>
