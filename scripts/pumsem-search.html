<section class="tab-panel" data-tab="pumsem" style="display:none">
      <header>
        <div class="header-top">
          <button class="sidebar-toggle" type="button" aria-label="사이드바 토글"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line></svg></button>
          <div class="header-main">
            <p class="eyebrow">Pumsem Standards Search</p>
            <h1>표준품셈 검색</h1>
            <div class="search-row">
              {{SEARCH_ICON}}
              <input id="pumsemQ" type="text" placeholder="항목 이름, 표 내용 등 검색어 입력" autofocus autocomplete="off">
            </div>
            <div class="filters" id="pumsemFilters">
                <button class="chip active" data-filter="all"><span class="dot"></span>전체 보기</button>
                <button class="chip" data-filter="공통"><span class="dot"></span>공통부문</button>
                <button class="chip" data-filter="토목"><span class="dot"></span>토목부문</button>
                <button class="chip" data-filter="건축"><span class="dot"></span>건축부문</button>
                <button class="chip" data-filter="기계설비"><span class="dot"></span>기계설비부문</button>
                <button class="chip" data-filter="유지관리"><span class="dot"></span>유지관리부문</button>
            </div>
            <div id="pumsemMeta"></div>
          </div>
        </div>
      </header>
      <div class="layout" id="pumsemLayout">
        <main id="pumsemResults" class="std-results"></main>
      </div>
    </section>
