<section class="tab-panel" data-tab="modelreview" style="display:none">
 <header><div class="header-top"><button class="sidebar-toggle" type="button" aria-label="사이드바 토글"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg></button><div class="header-main">
 <p class="eyebrow">BIM Workflow</p><h1>상하수도 BIM 업무분류</h1>
 <div id="mr-counts" class="filters" aria-label="수행방식 필터"></div><div id="mr-visible" aria-live="polite"></div>
 </div></div></header>
 <div id="mr-app">
 <div class="mr-toolbar-top">
  <label>프로젝트명<input id="mr-title" placeholder="프로젝트명을 입력하세요"></label>
  <label>검토일<input id="mr-date" type="date"></label>
  <div class="mr-actions mr-project-actions"><button id="mr-export">프로젝트 파일 저장</button><button id="mr-import">프로젝트 파일 불러오기</button><button id="mr-reset" type="button">초기화</button><input id="mr-file" type="file" accept=".json,application/json" hidden></div>
 </div>
 <p class="mr-hint mr-storage-hint">자동 저장은 이 브라우저에만 적용됩니다 · 다른 PC 작업은 프로젝트 파일로 저장/불러오기하세요 <span id="mr-save" role="status"></span></p>
 <div class="mr-view-tabs" role="tablist" aria-label="업무분류 보기"><button id="mr-list-tab" role="tab" aria-selected="true" aria-controls="mr-rows">업무 목록</button><button id="mr-graph-tab" role="tab" aria-selected="false" aria-controls="mr-graphs" tabindex="-1">그래프</button></div>
 <p class="mr-hint">병행 업무는 BIM·기존 방식 각각의 분담 범위를 적어주세요.</p>
 <details class="mr-setup"><summary>설계 업무 목록으로 시작</summary><p class="mr-hint">세부 업무와 두 업무방식을 가져옵니다 (수행방식은 모두 ‘미결정’으로 시작, 이후 자유롭게 수정 가능).</p><div class="mr-actions"><label>업무 목록<select id="mr-template" aria-label="설계 업무 목록"></select></label><button id="mr-template-add">업무 목록 추가</button></div><p id="mr-template-status" class="mr-hint" role="status"></p></details>
 <form id="mr-add" class="mr-add"><label>설계단계 / 분야<input name="category" list="mr-stages" placeholder="예: 실시설계 / 토목"></label><label>세부 업무<input name="name" required placeholder="예: 관로 종단면도 작성"></label><label>업무내용 / 성과품<input name="spec" placeholder="구간, 범위, 납품 성과품"></label><button type="submit" class="mr-primary">업무 추가</button></form><datalist id="mr-stages"></datalist>
 <div class="mr-toolbar"><label>설계단계<select id="mr-stage-filter"><option value="">전체 단계</option></select></label><div class="mr-actions"><label>PDF 출력 범위<select id="mr-print-scope"><option value="all">전체 업무</option><option value="filtered">현재 필터 결과</option></select></label><button id="mr-pdf" class="mr-primary" title="인쇄창에서 'PDF로 저장'을 선택하세요">PDF 저장 / 인쇄</button></div></div>
 <section id="mr-graphs" role="tabpanel" aria-labelledby="mr-graph-tab" hidden></section>
 <div id="mr-rows" role="tabpanel" aria-labelledby="mr-list-tab" class="mr-work-list" aria-label="프로젝트 업무 목록"></div>
 </div>
</section>
<section id="mr-print" aria-label="BIM 업무분류 출력 문서"></section>
